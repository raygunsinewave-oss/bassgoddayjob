name: Build, test & package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-14
            pluginval: pluginval_macOS.zip
          - name: Windows (x64)
            os: windows-2022
            pluginval: pluginval_Windows.zip
          - name: Linux (tests + VST3)
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb ninja-build

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -B build -G "Visual Studio 17 2022" -A x64
          elif [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Locate artefacts
        id: art
        shell: bash
        run: |
          ART=build/BASSGODSDAYJOB_artefacts/Release
          echo "dir=$ART" >> "$GITHUB_OUTPUT"
          ls -R "$ART" | head -50

      - name: pluginval (strictness 8)
        shell: bash
        run: |
          curl -L -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          7z x -y pluginval.zip > /dev/null || unzip -o pluginval.zip
          VST3="${{ steps.art.outputs.dir }}/VST3/BASSGODSDAYJOB.vst3"
          if [ "$RUNNER_OS" == "macOS" ]; then
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --timeout-ms 900000 --validate-in-process --validate "$VST3"
          elif [ "$RUNNER_OS" == "Windows" ]; then
            ./pluginval.exe --strictness-level 8 --timeout-ms 900000 --validate-in-process --validate "$VST3"
          else
            chmod +x pluginval
            xvfb-run -a ./pluginval --strictness-level 8 --timeout-ms 900000 --validate-in-process --skip-gui-tests --validate "$VST3"
          fi

      - name: auval (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "${{ steps.art.outputs.dir }}/AU/BASSGODSDAYJOB.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i rayg || true
          auval -v aumu Bgdj Rayg

      - name: macOS installer (.pkg, signed + notarized when secrets are set)
        if: runner.os == 'macOS'
        env:
          DEV_ID_APP: ${{ secrets.MACOS_DEV_ID_APP }}
          DEV_ID_INSTALLER: ${{ secrets.MACOS_DEV_ID_INSTALLER }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERT_P12_BASE64" ]; then installer/macos/import_certificates.sh; fi
          installer/macos/build_pkg.sh "${{ steps.art.outputs.dir }}" dist

      - name: macOS easy-install zip (AU + VST3 + app)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          ART="${{ steps.art.outputs.dir }}"
          Z=zipstage/BASSGODSDAYJOB-macOS
          mkdir -p "$Z" dist
          cp -R "$ART/AU/BASSGODSDAYJOB.component" "$ART/VST3/BASSGODSDAYJOB.vst3" "$ART/Standalone/BASSGODSDAYJOB.app" "$Z/"
          for b in "$Z"/*.component "$Z"/*.vst3 "$Z"/*.app; do
            if [ -n "${{ secrets.MACOS_DEV_ID_APP }}" ]; then codesign --force --deep --options runtime --timestamp --sign "${{ secrets.MACOS_DEV_ID_APP }}" "$b"; else codesign --force --deep --sign - "$b"; fi
          done
          cp installer/macos/zip/* "$Z/"
          chmod +x "$Z"/*.command
          lipo -info "$Z/BASSGODSDAYJOB.app/Contents/MacOS/BASSGODSDAYJOB"
          (cd zipstage && ditto -c -k --keepParent BASSGODSDAYJOB-macOS ../dist/BASSGODSDAYJOB-macOS.zip)
          ls -la dist

      - name: Upload macOS zip
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: BASSGODSDAYJOB-macOS-zip
          path: dist/BASSGODSDAYJOB-macOS.zip

      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc /DArtefacts="$PWD\${{ steps.art.outputs.dir }}" /O"$PWD\dist" installer\windows\BASSGODSDAYJOB.iss

      - name: Linux bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/BASSGODSDAYJOB-linux-x64.tar.gz -C "${{ steps.art.outputs.dir }}" VST3 Standalone

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: BASSGODSDAYJOB-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
